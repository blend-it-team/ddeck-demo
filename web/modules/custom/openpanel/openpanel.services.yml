services:
  openpanel.endpoint_resolver:
    class: Drupal\openpanel\Service\EndpointResolver
    arguments:
      - '@config.factory'

  openpanel.path_exclusion:
    class: Drupal\openpanel\Service\PathExclusion
    arguments:
      - '@config.factory'
      - '@request_stack'

  openpanel.secret_resolver:
    class: Drupal\openpanel\Service\SecretResolver
    arguments:
      - '@config.factory'
      - '@key.repository'

  openpanel.script_cache:
    class: Drupal\openpanel\Service\ScriptCache
    arguments:
      - '@cache.default'
      - '@http_client'
      - '@datetime.time'
      - '@openpanel.endpoint_resolver'

  openpanel.proxy_handler:
    class: Drupal\openpanel\Service\ProxyHandler
    arguments:
      - '@http_client'
      - '@request_stack'
      - '@openpanel.secret_resolver'
