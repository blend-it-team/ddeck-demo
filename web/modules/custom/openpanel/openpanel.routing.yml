openpanel.settings:
  path: '/admin/config/services/openpanel'
  defaults:
    _form: '\Drupal\openpanel\Form\SettingsForm'
    _title: 'OpenPanel'
  requirements:
    _permission: 'administer openpanel'

openpanel.op1_js:
  path: '/openpanel/op1.js'
  defaults:
    _controller: '\Drupal\openpanel\Controller\ScriptController::serve'
  requirements:
    _access: 'TRUE'

openpanel.proxy:
  path: '/openpanel'
  defaults:
    _controller: '\Drupal\openpanel\Controller\ProxyController::proxy'
  requirements:
    _access: 'TRUE'

openpanel.proxy.path:
  path: '/openpanel/{proxy_path}'
  defaults:
    _controller: '\Drupal\openpanel\Controller\ProxyController::proxy'
  requirements:
    _access: 'TRUE'
    proxy_path: '.+'
