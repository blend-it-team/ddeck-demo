ckeditor5_max_block_width_block_width:
  ckeditor5:
    plugins:
      - maxWidth.MaxWidth
  drupal:
    label: Block width
    library: ckeditor5_max_block_width/ckeditor5_max_block_width
    admin_library: ckeditor5_max_block_width/admin
    toolbar_items:
      maxWidth:
        label: Block width
    # Declares which tags may carry arbitrary `class` for this plugin. Drupal merges
    # these into the text format; match common block-level HTML (CKEditor $block).
    elements:
      - <table class>
      - <img class>
      - <drupal-media class>
