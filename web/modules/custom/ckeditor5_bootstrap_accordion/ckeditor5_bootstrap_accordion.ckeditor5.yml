# cSpell:ignore accordion

ckeditor5_bootstrap_accordion_accordion:
  ckeditor5:
    plugins:
      - accordion.Accordion

  drupal:
    label: Accordion
    library: ckeditor5_bootstrap_accordion/accordion
    admin_library: ckeditor5_bootstrap_accordion/admin.accordion
    toolbar_items:
      accordion:
        label: Add accordion
    elements:
      - <div class="accordion">
      - <div class="accordion-body">
      - <details class="accordion-item" name>
      - <summary class="accordion-header">
