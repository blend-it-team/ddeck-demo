<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grid layout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #1e293b;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      grid-template-rows: 64px minmax(0, 1fr);
      grid-template-areas:
        "header header"
        "sidebar main";
      height: 100dvh;
      overflow: hidden;
    }

    .header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #0f172a;
      color: white;
    }

    .header nav {
      display: flex;
      gap: 20px;
    }

    .header a {
      color: inherit;
      text-decoration: none;
    }

    .sidebar {
      grid-area: sidebar;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      background: #e2e8f0;
    }

    .sidebar a {
      display: block;
      margin-bottom: 16px;
      color: inherit;
      text-decoration: none;
    }

    .main {
      grid-area: main;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
      background: #f8fafc;
    }

    .sticky {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #cbd5e1;
    }

    .content {
      display: grid;
      gap: 24px;
      padding: 24px;
    }

    .card {
      min-height: 280px;
      padding: 24px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    @media (max-width: 640px) {
      .layout {
        grid-template-columns: 140px minmax(0, 1fr);
      }

      .header,
      .sidebar {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
<div class="layout">
  <header class="header">
    <strong>My App</strong>
    <nav aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Profile</a>
    </nav>
  </header>

  <aside class="sidebar">
    <nav aria-label="Sidebar navigation">
      <a href="#">Dashboard</a>
      <a href="#">Projects</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <main class="main">
    <div class="sticky">
      Sticky toolbar — stays visible as you scroll
    </div>

    <div class="content">
      <section class="card"><h2>Section 1</h2></section>
      <section class="card"><h2>Section 2</h2></section>
      <section class="card"><h2>Section 3</h2></section>
      <section class="card"><h2>Section 4</h2></section>
      <section class="card"><h2>Section 5</h2></section>
    </div>
  </main>
</div>
</body>
</html>
